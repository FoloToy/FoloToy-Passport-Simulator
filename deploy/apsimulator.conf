limit_req_zone $binary_remote_addr zone=apsimulator_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=apsimulator_connections:10m;

server {
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/apsimulator.folotoy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apsimulator.folotoy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:apsimulator_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name apsimulator.folotoy.cn;
    access_log /var/log/nginx/apsimulator.access.log;
    error_log /var/log/nginx/apsimulator.error.log;
    client_max_body_size 16k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apsimulator-acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4190;
        include /etc/nginx/snippets/apsimulator-proxy.conf;
    }

    location = /api/community-firmware {
        limit_req zone=apsimulator_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4190;
        include /etc/nginx/snippets/apsimulator-proxy.conf;
        proxy_read_timeout 180s;
    }

    location = /api/emulator-network {
        limit_conn apsimulator_connections 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:4190;
        include /etc/nginx/snippets/apsimulator-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name apsimulator.folotoy.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apsimulator-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://apsimulator.folotoy.cn$request_uri;
    }
}
